<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャートパターン画像ギャラリー - FX分析ナビ</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: 1fr;
            }
        }

        .gallery-item {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-8px);
        }

        .gallery-header {
            padding: 1.5rem;
            color: white;
            text-align: center;
        }

        .gallery-header.uptrend {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .gallery-header.downtrend {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .gallery-header.continuation {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .gallery-header h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
        }

        .gallery-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .chart-container {
            padding: 2rem;
            background-color: #f8fafc;
        }

        .chart-container canvas {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            background-color: white;
            border-radius: 8px;
        }

        .description {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .description h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .description-text {
            color: #666;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .key-points {
            background-color: #f0f9ff;
            padding: 1rem;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .key-points h4 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .key-points ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .key-points li {
            margin-bottom: 0.3rem;
            color: #666;
            font-size: 0.95rem;
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.7rem 1.5rem;
            border: 2px solid var(--primary-color);
            background-color: white;
            color: var(--primary-color);
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        .hidden {
            display: none;
        }

        .reliability-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #f59e0b;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .reliability-badge.high {
            background-color: #10b981;
        }

        .reliability-badge.medium {
            background-color: #f59e0b;
        }

        .reliability-badge.low {
            background-color: #ef4444;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">FX分析ナビ</div>
            <ul class="nav-links">
                <li><a href="index.html">ホーム</a></li>
                <li><a href="technical.html">テクニカル分析</a></li>
                <li><a href="patterns.html">チャートパターン</a></li>
                <li><a href="chart-gallery.html" class="active">パターン画像</a></li>
                <li><a href="indicator-builder.html">インジケーター</a></li>
                <li><a href="fundamental.html">ファンダメンタル分析</a></li>
            </ul>
        </div>
    </nav>

    <header class="page-header">
        <div class="container">
            <h1>チャートパターン画像ギャラリー</h1>
            <p>13種類のパターンを詳細なローソク足チャートで表示</p>
        </div>
    </header>

    <main class="container">
        <section class="content-section">
            <h2>パターンの見分け方</h2>
            <p>以下のギャラリーでは、各チャートパターンを実際のローソク足チャートで表現しています。各パターンの形状、発生条件、そしてシグナルがどこで発生するかを視覚的に理解できます。</p>
        </section>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterPattern('all')">すべて</button>
            <button class="filter-btn" onclick="filterPattern('reversal')">反転パターン</button>
            <button class="filter-btn" onclick="filterPattern('continuation')">継続パターン</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- ギャラリーアイテムがJavaScriptで動的に追加されます -->
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FX分析ナビ. All rights reserved.</p>
            <p class="disclaimer">このサイトは教育目的です。投資判断は自己責任で行ってください。</p>
        </div>
    </footer>

    <script src="chart-gallery.js"></script>
</body>
</html>
